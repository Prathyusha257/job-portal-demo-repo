<!DOCTYPE html>
<html>
<head>
  <title>Redirect</title>
  <script>
    const path = window.location.pathname.replace(/\/$/, '');
    if (!path.match(/\.\w+$/)) {
      window.location.href = '/job-portal-demo-repo/?redirect=' + encodeURIComponent(path);
    }
  </script>
</head>
<body></body>
</html>
